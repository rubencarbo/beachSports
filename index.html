<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Beach Sports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#3d8fd9" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Beach Sports" />
  <link href="fonts/fonts.css" rel="stylesheet" />
  <style>
    :root { --bg: #8cc8f0; --ink: #ffffff; --panel: #1d2a3a; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e1a28; } }
    :root[data-theme="dark"] { --bg: #0e1a28; }
    html, body { margin: 0; height: 100%; width: 100%; position: fixed; inset: 0; background: #000; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
    /* la caja del juego ocupa SÓLO la zona segura (sin la muesca/cámara): Phaser mide la caja entera,
       así que no se puede usar padding (desplazaba el lienzo y lo cortaba por la derecha) */
    :root { --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); }
    #game { position: fixed; top: var(--safe-t); right: var(--safe-r); bottom: var(--safe-b); left: var(--safe-l); overflow: hidden; }
    #game canvas { display: block; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--panel); color: var(--ink);
      font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 16px; line-height: 1.6; text-align: center;
      align-items: center; justify-content: center; flex-direction: column; gap: 18px; padding: 16px; }
    #rotate .phone { width: 46px; height: 80px; border: 5px solid #fff; border-radius: 10px; animation: rot 1.8s ease-in-out infinite; }
    @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="safe-probe" style="position:fixed;visibility:hidden;pointer-events:none;top:var(--safe-t);right:var(--safe-r);bottom:var(--safe-b);left:var(--safe-l)"></div>
  <script>
    // Ajuste a la pantalla visible real (iPhone): tamaño de la vista visible menos las zonas seguras.
    // iOS avisa del giro antes de tener las medidas nuevas: se recalcula varias veces y se avisa a Phaser.
    (function () {
      var game = document.getElementById('game'), probe = document.getElementById('safe-probe');
      function fit() {
        var vv = window.visualViewport, W = vv ? vv.width : window.innerWidth, H = vv ? vv.height : window.innerHeight;
        var cs = getComputedStyle(probe), l = parseFloat(cs.left) || 0, r = parseFloat(cs.right) || 0, t = parseFloat(cs.top) || 0, b = parseFloat(cs.bottom) || 0;
        window.scrollTo(0, 0);
        game.style.left = l + 'px'; game.style.top = t + 'px'; game.style.right = 'auto'; game.style.bottom = 'auto';
        game.style.width = Math.max(1, Math.round(W - l - r)) + 'px'; game.style.height = Math.max(1, Math.round(H - t - b)) + 'px';
        var g = window.__game; if (g && g.scale) g.scale.refresh();
      }
      function later() { fit(); [60, 250, 600, 1200].forEach(function (ms) { setTimeout(fit, ms); }); }
      window.addEventListener('resize', later);
      window.addEventListener('orientationchange', later);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', later);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) later(); });
      window.__fitScreen = later;
      later();
    })();
  </script>
  <div id="rotate"><div class="phone"></div>Gira el móvil para jugar</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
